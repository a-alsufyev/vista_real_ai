version: '3.8'

services:
  vistareal-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vistareal-ai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Secret key for JWT generation (recommended to override with actual secret in production)
      - JWT_SECRET=${JWT_SECRET:-vista-real-ai-heavy-production-secret-key-98765}
      # Database storage path mapped to persistent volume directory
      - DATABASE_PATH=/app/db_dir/database.sqlite
      # API Keys for AI Engines and Integrations
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VITE_YANDEX_MAPS_API_KEY=${VITE_YANDEX_MAPS_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      # Persistent storage for the SQLite database files (main database, journal files, and WAL mode assets)
      - sqlite-data:/app/db_dir
    command: npm start

volumes:
  # Named volume for absolute durability of your sqlite database
  sqlite-data:
